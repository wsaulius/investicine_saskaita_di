# Swedbank -> VMI mapping rules
# Actions: II, PP, IV, IGNORE, AUTO
# 
# Pattern collections can be defined in patterns.json and referenced here by name.
# Use @pattern_name syntax to reference a pattern collection.
#
# Example:
#   description_contains:
#     - "@fund_purchases"       # References pattern collection 'fund_purchases' from patterns.json
#     - "custom_literal"        # Inline literals still work

country: LT

# Whole Swedbank codes to ignore by default.
exclude_codes:
  - AS
  - LS
  - K2
  - M
  - TT
  - X

# Optional extra text filters.
exclude_description_contains: []

# Rows containing these snippets and positive amounts become IV.
# Can reference patterns from patterns.json or use inline literals.
dividend_description_contains:
  - "@dividends"

# Optional forced classes by description.
force_deposit_description_contains: []
force_withdrawal_description_contains: []

# Ordered, first-match rules. Use action=AUTO to continue to fallback logic.
# Pattern collections (@pattern_name) resolve to all patterns in that collection.
action_rules:
  - action: II
    when:
      code: M
      description_contains:
        - "@fund_purchases"

  - action: II
    when:
      code: MK
      receiver_contains:
        - "@fund_providers"

  - action: II
    when:
      code: MK
      description_contains:
        - "@real_estate"

  # Pension contributions are not part of investment-account flows.
  - action: IGNORE
    when:
      code: MK
      description_contains:
        - "@pension_contributions"

  # Fund redemptions/sales.
  - action: II
    when:
      code: MK
      description_contains:
        - "@fund_redemptions"

