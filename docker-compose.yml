version: '3.8'

services:
  vmi-editor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vmi-csv-editor
    ports:
      - "5001:5001"
    volumes:
      - ./output:/app/output
      - ./templates:/app/templates
      - ./static:/app/static
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - FLASK_PORT=5001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

